# Browser routes inherit ServerPortal device authentication.
location = /aicalendar { return 308 /aicalendar/$is_args$args; }
location ^~ /aicalendar/ {
    location ~ ^/aicalendar/(?:favicon\.svg|apple-touch-icon\.png)$ {
        auth_request off;
        limit_except GET { deny all; }
        rewrite ^/aicalendar/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18086;
    }
    # This exact API namespace requires the application's import-only Bearer token.
    # Other APIs and pages retain the shared device authentication.
    location ^~ /aicalendar/ingest/v1/ {
        auth_request off;
        proxy_pass http://127.0.0.1:18086/ingest/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_next_upstream off;
        proxy_redirect off;
    }
    proxy_pass http://127.0.0.1:18086/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    proxy_next_upstream off;
    proxy_redirect off;
}
